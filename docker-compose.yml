services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      REPORT_API_TOKEN: ${REPORT_API_TOKEN:?Set REPORT_API_TOKEN in .env}
      REPORT_SERVICE_URL: http://report:3001
      DATABASE_PATH: /data/opspilot.db
    volumes:
      - opspilot-data:/data
    depends_on:
      report:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  report:
    build: ./report_service
    environment:
      REPORT_API_TOKEN: ${REPORT_API_TOKEN:?Set REPORT_API_TOKEN in .env}
      REPORT_PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  opspilot-data:
